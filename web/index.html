<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e14">
  <title>remoat</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">remoat</div>
    <select id="device"><option>connecting…</option></select>
    <span id="status" class="dot" title="disconnected"></span>
  </header>

  <main id="pad" aria-label="touchpad">
    <div id="hint">touchpad · drag to move · tap = click · two-finger tap = right-click · two-finger drag = scroll</div>
  </main>

  <div id="toast"></div>

  <footer>
    <button id="ptt-type" class="ptt">
      <span class="lbl">Hold to type</span>
      <span class="sub">dictation</span>
    </button>
    <button id="ptt-cmd" class="ptt cmd">
      <span class="lbl">Hold to command</span>
      <span class="sub">"open browser"</span>
    </button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
