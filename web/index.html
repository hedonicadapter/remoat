<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e14">
  <title>remoat</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">remoat</div>
    <button id="devbtn" aria-label="devices"><span id="devname">connecting…</span><span class="chev">⌄</span></button>
    <span id="status" class="dot" title="disconnected"></span>
  </header>

  <section id="arrange" hidden aria-label="device arrangement">
    <div id="stage"></div>
    <p class="arrange-hint">drag to arrange · tap to switch · push the cursor off an edge to cross</p>
  </section>

  <div id="padwrap">
    <main id="pad" aria-label="touchpad">
      <img id="padcap" alt="">
      <div id="hint">touchpad · drag to move · tap = click · two-finger tap = right-click · bars = scroll</div>
    </main>
    <div id="zoomctl" aria-label="capture zoom">
      <button id="zoomin" aria-label="zoom in">+</button>
      <button id="zoomout" aria-label="zoom out">−</button>
    </div>
    <div id="vbar" class="scrollbar" aria-label="vertical scroll"><span class="grip"></span></div>
    <div id="hbar" class="scrollbar" aria-label="horizontal scroll"><span class="grip"></span></div>
  </div>

  <div id="toast"></div>

  <footer>
    <button id="ptt-type" class="ptt">
      <span class="lbl">Hold to type</span>
      <span class="sub">dictation</span>
    </button>
    <button id="ptt-cmd" class="ptt cmd">
      <span class="lbl">Hold to command</span>
      <span class="sub">"open browser"</span>
    </button>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
